# Apache Kafka + Zookeeper (cp 7.5.0). Tópicos NO se autocrean: los crean
# los microservicios (NewTopic) o ms-kafka-admin.
# Interno (otros contenedores): kafka:29092 | Host/local: localhost:9092
# En EC2: export KAFKA_PUBLIC_HOST=<ip publica> antes de `docker compose up -d`
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: calisat-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [calisat-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: calisat-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_PUBLIC_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [calisat-net]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  kafka_data:
  zookeeper_data:

networks:
  calisat-net:
    name: calisat-net
    driver: bridge
