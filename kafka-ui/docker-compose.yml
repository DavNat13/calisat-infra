# Kafka-UI: administración visual de brokers, tópicos y consumer groups.
# Requiere kafka/docker-compose.yml arriba (red calisat-net). UI: http://localhost:8080
services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: calisat-kafka-ui
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: calisat
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [calisat-net]

networks:
  calisat-net:
    name: calisat-net
    driver: bridge
